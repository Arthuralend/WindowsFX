<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1638"/>
      <stop offset="1" stop-color="#1A0F3D"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.18" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx="0.88" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#D946EF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="shardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="spark" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glowC)"/>
    <rect width="1024" height="1024" fill="url(#glowM)"/>

    <!-- glow behind the pane -->
    <circle cx="512" cy="512" r="380" fill="url(#halo)"/>

    <!-- left shard -->
    <polygon points="292,312 456,287 548,766 292,729" fill="url(#shardA)"/>
    <polygon points="292,312 456,287 548,766 292,729" fill="url(#gloss)"/>
    <!-- right shard -->
    <polygon points="486,270 734,232 734,770 574,746" fill="url(#shardB)"/>
    <polygon points="486,270 734,232 734,770 574,746" fill="url(#gloss)"/>

    <!-- light seam -->
    <line x1="471" y1="250" x2="566" y2="800" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.9" filter="url(#spark)"/>

    <!-- sparkle -->
    <g transform="translate(808,214)" filter="url(#spark)">
      <path d="M0,-78 C8,-18 18,-8 78,0 C18,8 8,18 0,78 C-8,18 -18,8 -78,0 C-18,-8 -8,-18 0,-78 Z" fill="#FFFFFF"/>
    </g>
    <circle cx="236" cy="236" r="9" fill="#A5F3FC" opacity="0.7"/>
    <circle cx="790" cy="840" r="7" fill="#F0ABFC" opacity="0.6"/>
  </g>
</svg>
