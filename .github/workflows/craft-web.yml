name: Build Craft engines (Lexicon, Tabs, Photostore)

# Builds the WebAssembly versions of WordCraft, GridCraft and PhotoCraft (MIT OR Apache-2.0)
# as Lexicon, Tabs and Photostore, with the WindowsFX changes:
#   - tools/craft-patch.sh: product names, no community links, Russian interface on the web,
#     the Photostore mark, Russian spelling dictionary for Lexicon;
#   - tools/patch-egui-wgpu.sh: egui-wgpu asks the GPU only for the texture size it supports.
# Results go to the "craft-assets" release; the APK build downloads them from there.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ ".github/workflows/craft-web.yml", "tools/patch-egui-wgpu.sh", "tools/craft-patch.sh", "tools/craft/**" ]

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: wordcraft
            ref: d588e0b87329975d0b06a9cf91e4d7d2ebacb0f8
          - app: gridcraft
            ref: 66ce6be4743f4227047f76f56815520f824e6d81
          - app: photocraft
            ref: d95fdf3181c01ad41e95456091a394b105a9afb2
    steps:
      - uses: actions/checkout@v4
        with:
          path: wfx

      - uses: actions/checkout@v4
        with:
          repository: storytold/${{ matrix.app }}
          ref: ${{ matrix.ref }}
          path: src
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: WindowsFX changes (names, links, language, dictionary)
        run: bash wfx/tools/craft-patch.sh ${{ matrix.app }} src

      - name: Patch egui-wgpu (GPU texture limit)
        run: bash wfx/tools/patch-egui-wgpu.sh src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: ${{ matrix.app }}

      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
          trunk --version

      - name: Build and package
        working-directory: src
        env:
          DIST: ${{ github.workspace }}/out
        run: |
          mkdir -p "$DIST"
          bash packaging/web/package.sh
          cd "$DIST"
          ZIP=$(ls ${{ matrix.app }}-web-*.zip | head -1)
          mv "$ZIP" ${{ matrix.app }}-web.zip
          ls -lh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: craft-assets
          name: Craft engines (Lexicon, Tabs, Photostore)
          body: "Web builds of WordCraft, GridCraft and PhotoCraft (MIT OR Apache-2.0) used by WindowsFX as Lexicon, Tabs and Photostore (tools/craft-patch.sh), with egui-wgpu limited to the GPU's texture size."
          files: out/${{ matrix.app }}-web.zip
          prerelease: true
          make_latest: false
