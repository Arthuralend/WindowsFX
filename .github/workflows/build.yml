name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ ".github/workflows/craft-web.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/WindowsFX-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsFX-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WindowsFX 0.1.${{ github.run_number }}
          body: "Автоматическая сборка. Скачайте APK ниже и установите на устройство."
          files: out/*.apk
          make_latest: true
