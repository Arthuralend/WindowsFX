name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ ".github/workflows/craft-web.yml", "tools/**" ]
  workflow_dispatch:
  workflow_run:
    workflows: [ "Build Craft engines (Lexicon, Tabs, Prism)" ]
    types: [ completed ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download Craft engines (Lexicon, Tabs, Prism)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          C=app/src/main/assets/craft
          mkdir -p $C/lexicon $C/tabs $C/prism tmpc
          for e in wordcraft gridcraft photocraft; do
            gh release download craft-assets -R ${{ github.repository }} -p "$e-web.zip" -D tmpc
            unzip -q "tmpc/$e-web.zip" -d "tmpc/$e"
          done
          cp -R tmpc/wordcraft/*/. $C/lexicon/
          cp -R tmpc/gridcraft/*/. $C/tabs/
          cp -R tmpc/photocraft/*/. $C/prism/
          ls -la $C/*/index.html
          du -sh $C/*

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/WindowsFX-0.3.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsFX-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WindowsFX 0.3.${{ github.run_number }}
          body: "Автоматическая сборка. Скачайте APK ниже и установите на устройство."
          files: out/*.apk
          make_latest: true
